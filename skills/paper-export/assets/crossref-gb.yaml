# pandoc-crossref 配置 :: GB 预设（图 1-1 / 表 2-3 / 式 (4-5)）
figureTitle: "图"
tableTitle: "表"
listingTitle: "代码"
figPrefix: ["图"]
tblPrefix: ["表"]
eqnPrefix: ["式"]
lstPrefix: ["代码"]
secPrefix: ["节"]
# 标签与题注之间用全角空格，符合中文排版
titleDelim: "　"
# 按章编号，分隔符为连字符 → 图 1-1
chapters: true
chaptersDepth: 1
chapDelim: "-"
# 引用多个对象时的连接符
rangeDelim: "~"
pairDelim: "、"
lastDelim: "和"
refDelim: "、"
# 代码块题注：```{#lst:id caption="..."}
codeBlockCaptions: true
# 链接到被引用对象
linkReferences: true
nameInLink: true
